<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220"
     role="img" aria-labelledby="title description">
  <title id="title">Ecore class diagram example</title>
  <desc id="description">Set with type parameters T and V, Source with attributes, E implementing Interface, and mandatory, derived and containment references.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 5 3 1 5" fill="none" stroke="#63708a" stroke-width="1.1"/>
    </marker>
    <marker id="blue-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 5 3 1 5" fill="none" stroke="#2d6f9f" stroke-width="1.1"/>
    </marker>
    <marker id="inheritance" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9Z" fill="#fff" stroke="#63708a" stroke-width="1.1"/>
    </marker>
  </defs>

  <path fill="#f8f9fc" d="M0 0H300V220H0Z"/>

  <g fill="none" stroke="#63708a" stroke-width="1.2" stroke-linejoin="round">
    <path d="M76 122V68" marker-end="url(#inheritance)"/>
    <path d="M246 122V68" stroke-dasharray="4 3" marker-end="url(#inheritance)"/>
    <path d="M76 18V8H154V37H138" marker-end="url(#arrow)"/>
  </g>

  <g stroke="#788398" stroke-width="1.1">
    <rect x="20" y="18" width="106" height="50" rx="4" fill="#e9e9f3"/>
    <rect x="210" y="18" width="72" height="50" rx="4" fill="#e9e9f3"/>
    <rect x="20" y="122" width="114" height="82" rx="4" fill="#ffffff"/>
    <rect x="210" y="122" width="72" height="82" rx="4" fill="#e9e9f3"/>
  </g>

  <g fill="#e9e9f3">
    <path d="M24 18H122Q126 18 126 22V40H20V22Q20 18 24 18Z"/>
    <path d="M214 18H278Q282 18 282 22V40H210V22Q210 18 214 18Z"/>
    <path d="M24 122H130Q134 122 134 126V144H20V126Q20 122 24 122Z"/>
    <path d="M214 122H278Q282 122 282 126V144H210V126Q210 122 214 122Z"/>
  </g>
  <path d="M22 21V39M212 21V39M22 125V143M212 125V143" stroke="#6561a8" stroke-width="3"/>
  <path d="M20 144H134" fill="none" stroke="#788398" stroke-width="1.1"/>

  <g font-family="Roboto, Arial, sans-serif" fill="#1e2644">
    <g font-size="14" font-weight="600" text-anchor="middle">
      <text x="73" y="34">Set</text>
      <text x="77" y="138">Source</text>
      <text x="246" y="138">E</text>
    </g>
    <text x="246" y="34" text-anchor="middle" font-size="13" font-style="italic">Interface</text>
    <text x="89" y="100" font-size="10" font-style="italic" fill="#63708a">&lt;&lt;bind&gt;&gt; C,E</text>
    <g font-size="10">
      <text x="31" y="161" font-weight="700">required : EString</text>
      <text x="31" y="177">optional : EString</text>
    </g>
  </g>

  <g fill="#ffffff" stroke="#788398" stroke-width=".9" stroke-dasharray="2 1.5">
    <rect x="120" y="29" width="18" height="16" rx="1"/>
    <rect x="120" y="49" width="18" height="16" rx="1"/>
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-size="9" fill="#566179" text-anchor="middle">
    <text x="129" y="40">T</text>
    <text x="129" y="60">V</text>
  </g>

  <g fill="none" stroke="#63708a" stroke-width="1.2" marker-end="url(#arrow)">
    <path d="M134 156H210"/>
    <path d="M134 195H210"/>
  </g>
  <path d="M134 172H210" fill="none" stroke="#2d6f9f" stroke-width="1.2" marker-end="url(#blue-arrow)"/>
  <path d="M134 195 139 192 144 195 139 198Z" fill="#63708a"/>
  <g font-family="Roboto, Arial, sans-serif" font-size="9" fill="#63708a">
    <text x="140" y="151" font-weight="700">requiredToE</text>
    <text x="140" y="168" fill="#2d6f9f">/derivedToE</text>
    <text x="140" y="190">containedToE</text>
  </g>
</svg>
